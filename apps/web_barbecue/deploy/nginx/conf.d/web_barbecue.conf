# Reverse proxy in front of the Daphne (ASGI) Django app. Both HTTP (80)
# and HTTPS (443) are served directly -- HTTP is not redirected to
# HTTPS, so an EC2 instance reachable only by IP (no cert yet) still
# works over plain HTTP while HTTPS is available wherever a certificate
# is mounted. Point ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS at the same
# host(s) used here.
#
# location /ws/ below proxies the /ws/admin/orders/ WebSocket to the
# same Daphne upstream as plain HTTP (one ASGI process serves both) -
# see web_barbecue.asgi and deploy/entrypoint.sh. It sets the
# Upgrade/Connection headers nginx needs to keep the TCP connection
# open as a WebSocket rather than treating it as a request/response.

upstream web_barbecue_app {
    server web:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    # Serves Let's Encrypt's HTTP-01 challenge files; deploy/init-letsencrypt.sh
    # and deploy/renew-certs.sh write into the same webroot from the certbot
    # container so this needs no separate setup.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://web_barbecue_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web_barbecue_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Self-signed by default (see deploy/generate-self-signed-cert.sh);
    # swap for a real certificate (e.g. from certbot) once a domain
    # points at this EC2 instance -- same paths, real files.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://web_barbecue_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web_barbecue_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
