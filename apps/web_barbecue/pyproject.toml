[project]
name = "web-barbecue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "daphne>=4.1",
    "channels>=4.1",
    "channels_redis>=4.2",
    "redis>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web_barbecue.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
